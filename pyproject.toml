[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncscope"
description = "Audio-visual synchronization and active-speaker detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jenna Wang" }]
keywords = ["audio-visual", "lip-sync", "active-speaker-detection", "signal-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dynamic = ["version"]
dependencies = [
  "numpy>=1.23",
]

[project.urls]
Homepage = "https://github.com/stella-sage553/syncscope"
Issues = "https://github.com/stella-sage553/syncscope/issues"

[project.optional-dependencies]
audio = ["librosa>=0.10", "soundfile>=0.12"]
video = ["opencv-python>=4.8"]
test = ["pytest>=7", "pytest-cov>=4"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8", "pre-commit>=3"]

[project.scripts]
syncscope = "syncscope.cli:main"

[tool.hatch.version]
path = "syncscope/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["syncscope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["syncscope"]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.run]
branch = true
source = ["syncscope"]
omit = ["syncscope/io.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
